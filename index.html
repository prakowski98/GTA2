<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uliczny Chaos - Gra Akcji</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
      color: #fff;
    }

    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
    }

    #game-canvas {
      display: block;
      background: #1a1a1a;
      image-rendering: pixelated;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: #00ff00;
      text-align: center;
    }

    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <div id="loading">
      ŁADOWANIE...<br>
      <small>Uliczny Chaos</small>
    </div>
  </div>

  <script type="module">
    import { Engine } from './game/core/Engine.js';
    import { EntityManager } from './game/entities/EntityManager.js';
    import { InputManager } from './game/input/InputManager.js';
    import { Camera } from './game/world/Camera.js';
    import { WorldGenerator } from './game/world/WorldGenerator.js';
    import { PhysicsSystem } from './game/systems/PhysicsSystem.js';
    import { RenderSystem } from './game/systems/RenderSystem.js';
    import { AISystem } from './game/systems/AISystem.js';
    import { CombatSystem } from './game/systems/CombatSystem.js';
    import { WantedSystem } from './game/systems/WantedSystem.js';
    import { MissionSystem } from './game/systems/MissionSystem.js';
    import { HUD } from './game/ui/HUD.js';
    import { Player } from './game/entities/Player.js';
    import { Vehicle } from './game/entities/Vehicle.js';
    import { NPC } from './game/entities/NPC.js';
    import { GameConfig } from './game/data/config.js';

    class Game {
      constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.loading = document.getElementById('loading');
        this.engine = new Engine(this.canvas);
        this.initialized = false;
      }

      async init() {
        const entityManager = new EntityManager();
        const inputManager = new InputManager();
        const camera = new Camera(GameConfig.canvas.width, GameConfig.canvas.height);
        const map = WorldGenerator.generate(GameConfig.world.width, GameConfig.world.height);

        this.engine.state = {
          entityManager,
          inputManager,
          camera,
          map
        };

        const physicsSystem = new PhysicsSystem(entityManager, map);
        const renderSystem = new RenderSystem(entityManager, map, camera);
        const aiSystem = new AISystem(entityManager);
        const combatSystem = new CombatSystem(entityManager);
        const wantedSystem = new WantedSystem(entityManager, map);
        const missionSystem = new MissionSystem(entityManager, map);
        const hud = new HUD(entityManager);

        this.engine.state.wantedSystem = wantedSystem;
        this.engine.state.missionSystem = missionSystem;

        this.engine.addSystem(physicsSystem);
        this.engine.addSystem(aiSystem);
        this.engine.addSystem(combatSystem);
        this.engine.addSystem(wantedSystem);
        this.engine.addSystem(missionSystem);
        this.engine.addSystem({
          update: (dt, engine) => {
            inputManager.update();
            camera.update(dt);
            entityManager.update();

            const player = entityManager.getByType('player')[0];
            if (player) {
              Player.update(player, inputManager, dt, engine);
            }
          }
        });

        this.engine.addRenderSystem(renderSystem);
        this.engine.addRenderSystem(hud);
        this.engine.addRenderSystem({
          render: (ctx, alpha, engine) => {
            const mission = missionSystem.currentMission;
            if (mission && mission.type === 'delivery') {
              camera.apply(ctx);
              ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
              ctx.beginPath();
              ctx.arc(mission.targetX, mission.targetY, mission.deliveryRadius, 0, Math.PI * 2);
              ctx.fill();
              ctx.strokeStyle = '#00ff00';
              ctx.lineWidth = 3;
              ctx.stroke();
              camera.restore(ctx);
            }

            for (const trigger of map.missionTriggers) {
              const mission = missionSystem.missions.find(m => m.id === trigger.missionId && !m.completed);
              if (mission && !missionSystem.currentMission) {
                camera.apply(ctx);
                ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(trigger.x, trigger.y, trigger.radius, 0, Math.PI * 2);
                ctx.fill();
                camera.restore(ctx);
              }
            }
          }
        });

        await this.loadMissions(missionSystem);
        this.spawnEntities(entityManager, map, camera);

        this.loading.classList.add('hidden');
        this.initialized = true;
      }

      async loadMissions(missionSystem) {
        try {
          const response = await fetch('./game/data/missions.json');
          const missions = await response.json();
          missionSystem.loadMissions(missions);
        } catch (error) {
          console.warn('Could not load missions, using defaults');
          missionSystem.loadMissions([
            {
              id: 'mission_1',
              title: 'Dostawa Paczki',
              description: 'Dostarcz paczkę na miejsce',
              type: 'delivery',
              targetX: 1200,
              targetY: 1200,
              deliveryRadius: 80,
              reward: 500
            }
          ]);
        }
      }

      spawnEntities(entityManager, map, camera) {
        const playerSpawn = map.spawnPoints.find(s => s.type === 'player');
        const player = Player.create(
          entityManager,
          playerSpawn.x,
          playerSpawn.y
        );
        camera.setTarget(player);

        for (const spawn of map.spawnPoints) {
          if (spawn.type === 'npc') {
            NPC.create(entityManager, spawn.x, spawn.y, 'civilian');
          }
        }

        for (const spawn of map.vehicleSpawns) {
          Vehicle.create(entityManager, spawn.x, spawn.y, spawn.vehicleType);
        }

        for (let i = 0; i < 5; i++) {
          const x = Math.random() * map.width;
          const y = Math.random() * map.height;
          if (!map.isCollision(x, y)) {
            NPC.create(entityManager, x, y, 'police');
          }
        }
      }

      start() {
        this.engine.start();
      }
    }

    const game = new Game();
    game.init().then(() => {
      game.start();
    });
  </script>
</body>
</html>
